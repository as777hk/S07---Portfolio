name: Host SAM hero video

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/host-hero-video.yml

permissions:
  contents: write

jobs:
  host-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out portfolio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Download and validate original video
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p public/media
          curl --fail --location --show-error --retry 2 --connect-timeout 30 --max-time 240 \
            "https://at.adobe.com/73GKuQHUaofsXd99" \
            --output /tmp/sam-hero-source.mp4
          test "$(stat -c%s /tmp/sam-hero-source.mp4)" -gt 1000000
          duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/sam-hero-source.mp4)"
          codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 /tmp/sam-hero-source.mp4)"
          echo "Video codec: $codec"
          echo "Video duration: $duration seconds"
          awk -v d="$duration" 'BEGIN { if (d < 24 || d > 27) exit 1 }'
          cp /tmp/sam-hero-source.mp4 public/media/sam-hero-source.mp4

      - name: Commit the locally hosted video
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/sam-hero-source.mp4
          if git diff --cached --quiet; then
            echo "Hero video is already current."
            exit 0
          fi
          git commit -m "Host SAM hero video on portfolio"
          git push origin HEAD:main
