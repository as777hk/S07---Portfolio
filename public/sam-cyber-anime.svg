<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 610" fill="none" role="img" aria-labelledby="title desc">
<title id="title">SAM cyber anime operative</title>
<desc id="desc">A hooded anime-inspired cyber operative in black armor with crimson circuitry. The face is completely hidden in shadow.</desc>
<defs>
  <linearGradient id="hood" x1="112" y1="77" x2="347" y2="303" gradientUnits="userSpaceOnUse">
    <stop stop-color="#262A36"/><stop offset=".42" stop-color="#090B12"/><stop offset="1" stop-color="#030408"/>
  </linearGradient>
  <linearGradient id="cloth" x1="115" y1="260" x2="368" y2="602" gradientUnits="userSpaceOnUse">
    <stop stop-color="#202431"/><stop offset=".3" stop-color="#10131C"/><stop offset="1" stop-color="#030509"/>
  </linearGradient>
  <linearGradient id="armor" x1="91" y1="304" x2="386" y2="540" gradientUnits="userSpaceOnUse">
    <stop stop-color="#303646"/><stop offset=".45" stop-color="#11151F"/><stop offset="1" stop-color="#252B39"/>
  </linearGradient>
  <linearGradient id="redEdge" x1="105" y1="150" x2="360" y2="450" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FF5369"/><stop offset=".42" stop-color="#E11D48"/><stop offset="1" stop-color="#650D22"/>
  </linearGradient>
  <linearGradient id="visor" x1="173" y1="180" x2="315" y2="218" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FF8B9B"/><stop offset=".38" stop-color="#F43F5E"/><stop offset="1" stop-color="#7F102B"/>
  </linearGradient>
  <linearGradient id="cool" x1="90" y1="160" x2="382" y2="460" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8FA8D5"/><stop offset="1" stop-color="#263750"/>
  </linearGradient>
  <filter id="redGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="7" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 0.92  0 0 0 0 0.04  0 0 0 0 0.15  0 0 0 .8 0" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="13"/>
  </filter>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#68748A"/><stop offset=".38" stop-color="#202838"/><stop offset="1" stop-color="#090D15"/>
  </linearGradient>
</defs>

